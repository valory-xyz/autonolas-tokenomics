[profile.default]
#solc = "0.8.30"
auto_detect_solc = true
src = "contracts"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
evm_version = "prague"
viaIR = true
# Read-only: the PolygonBurnForwarder fork tests derive its address from the deploy script's globals
fs_permissions = [{ access = "read", path = "./scripts/deployment/utils" }]

remappings = [
    "canonical-weth=node_modules/canonical-weth",
    "@gnosis.pm=node_modules/@gnosis.pm",
    "@prb=node_modules/@prb",
    "@uniswap=node_modules/@uniswap",
    "wormhole-solidity-sdk=node_modules/wormhole-solidity-sdk",
]
